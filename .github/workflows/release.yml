name: Release

# Cria um release no GitHub com os APKs assinados sempre que você der push numa tag v*
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Instalar NDK e CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Testes do motor
        working-directory: engine
        run: go test ./...

      - name: Gerar engine.aar (gomobile)
        working-directory: engine
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -target=android/arm64,android/arm -androidapi 28 \
            -javapkg=com.zapfig.engine -ldflags="-s -w" -o ../app/libs/engine.aar ./bot

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ZAPFIG_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Compilar APKs
        env:
          ZAPFIG_KEYSTORE: release.jks
          ZAPFIG_KEYSTORE_PASSWORD: ${{ secrets.ZAPFIG_KEYSTORE_PASSWORD }}
          ZAPFIG_KEY_ALIAS: ${{ secrets.ZAPFIG_KEY_ALIAS }}
          ZAPFIG_KEY_PASSWORD: ${{ secrets.ZAPFIG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
